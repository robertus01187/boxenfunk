name: Release

# Neue Version = Versionsnummer in pyproject.toml erhöhen und nach main pushen.
# Existiert das Release vX.Y.Z noch nicht, wird die exe gebaut und das Release samt Tag angelegt.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Version lesen und prüfen, ob es das Release schon gibt
        id: ver
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" >/dev/null 2>&1; then echo "neu=false" >> "$GITHUB_OUTPUT"; else echo "neu=true" >> "$GITHUB_OUTPUT"; fi
      - name: Installieren
        if: steps.ver.outputs.neu == 'true'
        run: pip install ".[dev,build]"
      - name: Tests
        if: steps.ver.outputs.neu == 'true'
        run: pytest
      - name: exe bauen
        if: steps.ver.outputs.neu == 'true'
        run: pyinstaller --noconfirm --onefile --windowed --name Boxenfunk packaging/launcher.py
      - name: exe-Smoke-Test (startet und beendet sich selbst)
        if: steps.ver.outputs.neu == 'true'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist/Boxenfunk.exe -ArgumentList "--quit-after","3000" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Boxenfunk.exe Exit-Code $($p.ExitCode)" }
      - if: steps.ver.outputs.neu == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Boxenfunk-exe
          path: dist/Boxenfunk.exe
      - name: GitHub-Release anlegen
        if: steps.ver.outputs.neu == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Boxenfunk ${{ steps.ver.outputs.tag }}
          files: dist/Boxenfunk.exe
          generate_release_notes: true
